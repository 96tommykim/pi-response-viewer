<body>
  <div class="workspace">
    <header class="toolbar">
      <div class="session-meta"><div class="session-title">Response viewer</div><div class="session-subtitle">Pi · assistant response history</div></div>
      <div class="history-control" id="history-control" hidden aria-label="Response history">
        <button class="icon-button" id="previous-response" type="button" aria-label="Previous response" title="Previous response">←</button><span class="history-position" id="history-position" aria-live="off"></span><button class="icon-button" id="next-response" type="button" aria-label="Next response" title="Next response">→</button>
      </div>
      <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch theme"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></button>
    </header>
    <main class="main-layout">
      <article class="transcript" aria-label="Assistant response">
        <header class="response-header"><div class="eyebrow" id="response-meta">Waiting for a response</div><h1 id="response-title">Response viewer</h1><p class="lede">Pi stays in the terminal for input and fallback transcript. This local reader follows the latest assistant text response.</p></header>
        <div class="article-body" id="response-body"></div>
      </article>
      <details class="outline" id="response-outline" open><summary>On this page</summary><div class="outline-title">On this page</div><div id="outline-links"></div></details>
    </main>
  </div>
  <button class="control new-content" id="new-content" type="button" hidden>New content available — Jump to latest</button>
  <div class="sr-only" id="status" aria-live="polite" aria-atomic="true"></div>
